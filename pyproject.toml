[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynxai"
version = "0.1.0"
description = "lynxai research package"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "torch",
    "gymnasium",
]

[project.optional-dependencies]
ppo = [
    "stable-baselines3",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["lynxai*", "utils*", "app*"]
