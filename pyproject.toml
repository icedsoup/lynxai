[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lynxai"
version = "0.1.0"
description = "lynxai research package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml",
    "torch",
    "gymnasium",
]

[project.optional-dependencies]
ppo = [
    "stable-baselines3",
]

[dependency-groups]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
lynxai = "lynxai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lynxai*"]

[tool.setuptools.package-data]
lynxai = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
