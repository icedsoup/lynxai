experiment:
  name: "lynxai-baseline"
  seed: 1337

observation:
  width: 84
  height: 84
  grayscale: true
  history_length: 4
  channels: 1
  frame_skip: 1
  dtype: "float32"

actions:
  names:
    - "move_left"
    - "move_right"
    - "move_forward"
    - "move_back"
    - "jump"
    - "shoot"
  discrete: true
  continuous: false

reward:
  kill: 10.0
  death: -10.0
  damage: 0.05
  survival: 0.01
  invalid_action_penalty: -0.01
  time_step: -0.001

training:
  algorithm: "ppo"
  total_timesteps: 1000000
  learning_rate: 0.0003
  batch_size: 64
  n_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  checkpoint_dir: "checkpoints"
